<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Laporan Pengelola — SarprasKost</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="mobile-shell">
    <header class="app-bar">
      <a href="owner-laporan.html" class="back-btn" aria-label="Kembali ke daftar laporan">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4.166L4.16602 10L10 15.834M4.16602 10H15.834" stroke="#172554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <div class="app-bar-titles">
        <h1 class="app-bar-title">Detail laporan</h1>
        <p id="detailKodeSub" class="app-bar-subtitle">Memuat kode tiket...</p>
      </div>
    </header>

    <section id="detailContent" class="page-body has-bottom-action">
      <div id="detailError" class="error-banner" role="alert"></div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <span id="detailMeta" style="font-size:11px;color:#64748B;">-</span>
          <span id="detailStatusBadge" class="status-badge status-menunggu">
            <span class="status-dot"></span>
            <span>Menunggu</span>
          </span>
        </div>
        <h2 id="detailTitle" class="detail-title">Memuat detail laporan...</h2>
      </div>

      <div id="detailPhotoBox" class="photo-box">
        <img id="detailPhotoImg" class="photo-img" src="" alt="Foto bukti kerusakan" />
        <div class="photo-placeholder-label">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M4 16L8.586 11.414C9.367 10.633 10.633 10.633 11.414 11.414L16 16M14 14L15.586 12.414C16.367 11.633 17.633 11.633 18.414 12.414L20 14M6 20H18C19.105 20 20 19.105 20 18V6C20 4.895 19.105 4 18 4H6C4.895 4 4 4.895 4 6V18C4 19.105 4.895 20 6 20ZM9 9C9 9.552 8.552 10 8 10C7.448 10 7 9.552 7 9C7 8.448 7.448 8 8 8C8.552 8 9 8.448 9 9Z" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Tidak ada foto bukti kerusakan</span>
        </div>
        <div id="photoCountPill" class="photo-count-pill" style="display:none;">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M10.5 7.49985L8.957 5.95685C8.58 5.58 7.92 5.58 7.543 5.95685L3 10.4998M2.5 1.5H9.5C10.0523 1.5 10.5 1.94772 10.5 2.5V9.5C10.5 10.0523 10.0523 10.5 9.5 10.5H2.5C1.94772 10.5 1.5 10.0523 1.5 9.5V2.5C1.5 1.94772 1.94772 1.5 2.5 1.5ZM5.5 4.5C5.5 5.05228 5.05228 5.5 4.5 5.5C3.94772 5.5 3.5 5.05228 3.5 4.5C3.5 3.94772 3.94772 3.5 4.5 3.5C5.05228 3.5 5.5 3.94772 5.5 4.5Z" stroke="white" stroke-linecap="round" />
          </svg>
          <span>1 foto</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <p id="detailDesc" class="detail-desc">-</p>
        <div class="detail-location-row">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;">
            <path d="M13.3328 6.66662C13.3328 9.9956 9.64054 13.4626 8.40066 14.5333C8.16 14.71 7.84 14.71 7.59941 14.5333C6.35953 13.4626 2.66724 9.9956 2.66724 6.66662C2.66724 3.72 5.05 1.33279 8.00004 1.33279C10.95 1.33279 13.3328 3.72 13.3328 6.66662ZM9.99984 6.66662C9.99984 7.77129 9.1045 8.66681 8.00004 8.66681C6.89558 8.66681 6.00024 7.77129 6.00024 6.66662C6.00024 5.56195 6.89558 4.66644 8.00004 4.66644C9.1045 4.66644 9.99984 5.56195 9.99984 6.66662Z" stroke="#2563EB" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span id="detailLokasi">-</span>
        </div>
      </div>

      <div class="resident-info-card">
        <div id="residentAvatar" class="resident-avatar">P</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
          <div style="font-size:10px;color:#64748B;">Informasi Pelapor</div>
          <div id="detailPenghuniNama" style="font-size:14px;font-weight:600;color:#172554;">Pelapor: - &bull; Penghuni</div>
          <div id="detailPenghuniKamar" style="font-size:12px;color:#64748B;">Kamar -</div>
        </div>
      </div>

      <div id="detailStatusBanner" class="info-banner">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:2px;">
          <path d="M7.99996 3.9997V8.00003H10.6668M14.6672 8.00003C14.6672 11.6822 11.6822 14.6672 7.99996 14.6672C4.31777 14.6672 1.33276 11.6822 1.33276 8.00003C1.33276 4.31783 4.31777 1.33282 7.99996 1.33282C11.6822 1.33282 14.6672 4.31783 14.6672 8.00003Z" stroke="#2563EB" stroke-width="1.3" stroke-linecap="round" />
        </svg>
        <span id="detailStatusInfo">Laporan menunggu verifikasi pengelola untuk ditugaskan ke teknisi atau ditolak.</span>
      </div>

      <div id="detailAssignmentCard" class="summary-mini-card" style="display:none;"></div>

      <div style="display:flex;flex-direction:column;gap:14px;">
        <h3 class="section-title">Progres penanganan</h3>
        <div id="timelineContainer" class="timeline"></div>
      </div>
    </section>

    <div id="ownerActionBar" class="owner-bottom-action-bar">
      <a id="tolakLinkBtn" href="owner-tolak.html" class="btn btn-danger">Tolak</a>
      <a id="setujuiLinkBtn" href="owner-setujui.html" class="btn btn-primary">Setujui &amp; tugaskan</a>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    (async () => {
      const user = SarprasApp.requireOwnerAuth();
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const errorBanner = document.getElementById('detailError');

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.add('visible');
      }

      if (!id) {
        showError('ID laporan tidak ditemukan di URL.');
        document.getElementById('detailTitle').textContent = 'Laporan tidak ditemukan';
        document.getElementById('ownerActionBar').style.display = 'none';
        return;
      }

      document.getElementById('tolakLinkBtn').href = `owner-tolak.html?id=${encodeURIComponent(id)}`;
      document.getElementById('setujuiLinkBtn').href = `owner-setujui.html?id=${encodeURIComponent(id)}`;

      function renderTimeline(laporan) {
        const status = (laporan.status || 'MENUNGGU').toUpperCase();
        const checkSvg = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M9.99969 3L4.50024 8.4996L2.00049 5.99978" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const closeSvg = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M9 3L3 9M3 3L9 9" stroke="#B91C1C" stroke-width="1.6" stroke-linecap="round"/></svg>';

        let steps = [];
        if (status === 'DITOLAK') {
          steps = [
            { state: 'done', label: 'Laporan diterima', time: SarprasApp.formatDateTimeIndo(laporan.tanggal_lapor), bold: false },
            { state: 'rejected', label: 'Laporan ditolak pengelola', time: SarprasApp.formatDateTimeIndo(laporan.tanggal_diproses || laporan.tanggal_lapor), bold: true }
          ];
        } else {
          const isDiprosesOrSelesai = status === 'DIPROSES' || status === 'SELESAI';
          const isSelesai = status === 'SELESAI';
          steps = [
            { state: 'done', label: 'Laporan diterima', time: SarprasApp.formatDateTimeIndo(laporan.tanggal_lapor), bold: status === 'MENUNGGU' },
            { state: isDiprosesOrSelesai ? 'done' : 'active', label: 'Diverifikasi pengelola', time: isDiprosesOrSelesai ? SarprasApp.formatDateTimeIndo(laporan.tanggal_diproses || laporan.tanggal_lapor) : 'Menunggu verifikasi', bold: status === 'MENUNGGU' },
            { state: isSelesai ? 'done' : (status === 'DIPROSES' ? 'active' : 'pending'), label: 'Sedang diperbaiki', time: laporan.tanggal_diproses ? SarprasApp.formatDateTimeIndo(laporan.tanggal_diproses) : 'Menunggu teknisi', bold: status === 'DIPROSES' },
            { state: isSelesai ? 'done' : 'pending', label: 'Perbaikan selesai', time: laporan.tanggal_selesai ? SarprasApp.formatDateTimeIndo(laporan.tanggal_selesai) : 'Menunggu perbaikan', bold: isSelesai }
          ];
        }

        document.getElementById('timelineContainer').innerHTML = steps.map((step, index) => {
          const isLast = index === steps.length - 1;
          let dotContent = '';
          if (step.state === 'done') dotContent = checkSvg;
          if (step.state === 'rejected') dotContent = closeSvg;
          const labelClass = step.state === 'pending' ? 'timeline-label muted' : (step.bold ? 'timeline-label bold' : 'timeline-label');
          return `
            <div class="timeline-item">
              <div class="timeline-rail">
                <div class="timeline-dot ${step.state}">${dotContent}</div>
                ${isLast ? '' : '<div class="timeline-line"></div>'}
              </div>
              <div class="timeline-content" style="${isLast ? 'padding-bottom:0;' : ''}">
                <span class="${labelClass}">${SarprasApp.escapeHtml(step.label)}</span>
                <span class="timeline-time">${SarprasApp.escapeHtml(step.time)}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderDetail(laporan) {
        document.getElementById('detailKodeSub').textContent = laporan.kode_laporan;
        document.getElementById('detailMeta').textContent = `${laporan.kategori_fasilitas} • ${SarprasApp.formatDateIndo(laporan.tanggal_lapor)}`;
        document.getElementById('detailTitle').textContent = SarprasApp.deriveTitle(laporan);
        document.getElementById('detailDesc').textContent = laporan.deskripsi || '-';
        document.getElementById('detailLokasi').textContent = laporan.lokasi_kamar || '-';

        const meta = SarprasApp.getStatusMeta(laporan.status);
        const badge = document.getElementById('detailStatusBadge');
        badge.className = `status-badge ${meta.className}`;
        badge.innerHTML = `<span class="status-dot"></span><span>${SarprasApp.escapeHtml(meta.label)}</span>`;

        const namaPenghuni = laporan.nama_penghuni || 'Penghuni Kost';
        const initial = namaPenghuni.trim().charAt(0).toUpperCase() || 'P';
        document.getElementById('residentAvatar').textContent = initial;
        document.getElementById('detailPenghuniNama').textContent = `Pelapor: ${namaPenghuni} • Penghuni`;
        document.getElementById('detailPenghuniKamar').textContent = laporan.nomor_kamar_penghuni
          ? `Kamar ${laporan.nomor_kamar_penghuni}`
          : 'Penghuni Kost Cendana';

        const photoBox = document.getElementById('detailPhotoBox');
        const photoImg = document.getElementById('detailPhotoImg');
        const photoCountPill = document.getElementById('photoCountPill');

        if (laporan.foto_url) {
          photoImg.src = laporan.foto_url;
          photoBox.classList.add('has-image');
          photoCountPill.style.display = 'inline-flex';
          photoImg.onerror = () => {
            photoImg.setAttribute('src', '');
            photoBox.classList.remove('has-image');
            photoCountPill.style.display = 'none';
          };
        }

        const statusUpper = (laporan.status || 'MENUNGGU').toUpperCase();
        const statusBanner = document.getElementById('detailStatusBanner');
        const statusInfo = document.getElementById('detailStatusInfo');
        const assignCard = document.getElementById('detailAssignmentCard');

        if (statusUpper === 'DITOLAK') {
          statusBanner.className = 'info-banner danger';
          statusInfo.textContent = laporan.catatan_penanganan || 'Laporan telah ditolak oleh pengelola kost.';
          assignCard.style.display = 'flex';
          assignCard.innerHTML = `
            <div class="kv-row">
              <span class="kv-label">Kategori Penolakan</span>
              <span class="kv-value">${SarprasApp.escapeHtml(laporan.kategori_penolakan || '-')}</span>
            </div>
            <div class="kv-row">
              <span class="kv-label">Alasan Penolakan</span>
              <span class="kv-value">${SarprasApp.escapeHtml(laporan.alasan_penolakan || laporan.catatan_penanganan || '-')}</span>
            </div>
          `;
        } else if (statusUpper === 'DIPROSES' || statusUpper === 'SELESAI') {
          statusBanner.className = 'info-banner';
          statusInfo.textContent = laporan.catatan_penanganan || 'Laporan sedang ditangani oleh teknisi kost.';
          if (laporan.nama_mekanik || laporan.prioritas || laporan.catatan_owner) {
            assignCard.style.display = 'flex';
            assignCard.innerHTML = `
              <div class="kv-row">
                <span class="kv-label">Teknisi Ditugaskan</span>
                <span class="kv-value">${SarprasApp.escapeHtml(laporan.nama_mekanik || '-')}</span>
              </div>
              <div class="kv-row">
                <span class="kv-label">Prioritas</span>
                <span class="kv-value">${SarprasApp.escapeHtml(laporan.prioritas || '-')}</span>
              </div>
              ${laporan.catatan_owner ? `
                <div class="kv-row">
                  <span class="kv-label">Catatan Pengelola</span>
                  <span class="kv-value">${SarprasApp.escapeHtml(laporan.catatan_owner)}</span>
                </div>
              ` : ''}
              ${laporan.catatan_mekanik ? `
                <div class="kv-row">
                  <span class="kv-label">Catatan Teknisi</span>
                  <span class="kv-value">${SarprasApp.escapeHtml(laporan.catatan_mekanik)}</span>
                </div>
              ` : ''}
              ${laporan.foto_selesai_url ? `
                <div class="photo-box has-image" style="height:140px;margin-top:6px;">
                  <img class="photo-img" src="${SarprasApp.escapeHtml(laporan.foto_selesai_url)}" alt="Foto bukti penyelesaian teknisi" />
                </div>
              ` : ''}
            `;
          }
        } else {
          statusBanner.className = 'info-banner';
          statusInfo.textContent = 'Laporan baru masuk. Silakan setujui untuk menugaskan mekanik atau tolak dengan alasan yang jelas.';
          assignCard.style.display = 'none';
        }

        renderTimeline(laporan);
      }

      try {
        const laporan = await SarprasApp.requestJson(`/laporan/${encodeURIComponent(id)}`);
        renderDetail(laporan);
      } catch (err) {
        showError(err.message || 'Gagal memuat detail laporan.');
        document.getElementById('detailTitle').textContent = 'Gagal memuat data';
      }
    })();
  </script>
</body>
</html>
