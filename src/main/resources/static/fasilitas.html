<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fasilitas Kamar - SarprasKost</title>
  <link rel="stylesheet" href="css/style.css?v=20261125v3" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/logo-sarpraskost.svg" />
</head>
<body>
  <main class="mobile-shell">
    <header class="app-bar">
      <a href="home.html" class="back-btn" aria-label="Kembali ke beranda">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4.166L4.16602 10L10 15.834M4.16602 10H15.834" stroke="#172554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <div class="app-bar-titles">
        <h1 class="app-bar-title">Fasilitas kamar</h1>
        <p id="fasilitasRoomSub" class="app-bar-subtitle">Inventaris aset kamar Anda</p>
      </div>
    </header>

    <section class="page-body has-bottom-nav">
      <div class="info-banner">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" style="flex-shrink:0;margin-top:2px;"><path d="M8.50004 11.3336V8.50001M8.50004 5.66645H8.50712M15.5839 8.50001C15.5839 12.4123 12.4124 15.5839 8.50004 15.5839C4.58771 15.5839 1.41614 12.4123 1.41614 8.50001C1.41614 4.58768 4.58771 1.41611 8.50004 1.41611C12.4124 1.41611 15.5839 4.58768 15.5839 8.50001Z" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Inventaris dan kondisi aset dicatat oleh pengelola kost. Pilih <strong>Laporkan Kerusakan</strong> jika ada aset yang bermasalah.</span>
      </div>

      <div id="fasilitasError" class="error-banner" role="alert"></div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="section-header">
          <h2 class="section-title">Daftar fasilitas kamar</h2>
          <span id="fasilitasCountLabel" class="section-meta">0 item</span>
        </div>

        <div id="fasilitasList" class="report-list">
          <div class="loading-state">Memuat daftar fasilitas...</div>
        </div>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <div class="bottom-nav-grid">
        <a href="home.html" class="bottom-nav-item">
          <svg width="21" height="21" viewBox="0 0 21 21" fill="none"><path d="M13.125 18.3743V11.3743C13.125 10.9 12.73 10.4993 12.25 10.4993H8.75C8.27 10.4993 7.875 10.9 7.875 11.3743V18.3743M2.625 8.74975C2.625 8.23 2.86 7.74 3.245 7.41L9.37 2.16C10.02 1.61 10.98 1.61 11.63 2.16L17.755 7.41C18.14 7.74 18.375 8.23 18.375 8.75V16.625C18.375 17.59 17.59 18.375 16.625 18.375H4.375C3.41 18.375 2.625 17.59 2.625 16.625V8.74975Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Beranda</span>
        </a>
        <a href="riwayat.html" class="bottom-nav-item">
          <svg width="21" height="21" viewBox="0 0 21 21" fill="none"><path d="M13.9997 3.49947H15.7495C16.716 3.49947 17.4993 4.283 17.4993 5.24961V17.5006C17.4993 18.467 16.716 19.2507 15.7495 19.2507H5.25056C4.284 19.2507 3.50073 18.467 3.50073 17.5006V5.24961C3.50073 4.283 4.284 3.49947 5.25056 3.49947H7.00038M10.5 9.62496H13.9997M10.5 14.0003H13.9997M7.00038 9.62496H7.00913M7.00038 14.0003H7.00913M7.87529 1.74933H13.1248C13.608 1.74933 13.9997 2.14111 13.9997 2.6244V4.37454C13.9997 4.85783 13.608 5.24961 13.1248 5.24961H7.87529C7.39209 5.24961 7.00038 4.85783 7.00038 4.37454V2.6244C7.00038 2.14111 7.39209 1.74933 7.87529 1.74933Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Riwayat</span>
        </a>
        <a href="fasilitas.html" class="bottom-nav-item active">
          <svg width="21" height="21" viewBox="0 0 21 21" fill="none"><path d="M3.5 8.75V5.25C3.5 4.2835 4.2835 3.5 5.25 3.5H15.75C16.7165 3.5 17.5 4.2835 17.5 5.25V8.75M3.5 8.75H17.5M3.5 8.75V15.75C3.5 16.7165 4.2835 17.5 5.25 17.5H15.75C16.7165 17.5 17.5 16.7165 17.5 15.75V8.75M7.875 13.125H13.125" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Fasilitas</span>
        </a>
        <a href="profil.html" class="bottom-nav-item">
          <svg width="21" height="21" viewBox="0 0 21 21" fill="none"><path d="M10.5 11.375C12.916 11.375 14.8746 9.41625 14.8746 7C14.8746 4.58375 12.916 2.625 10.5 2.625C8.08403 2.625 6.12547 4.58375 6.12547 7C6.12547 9.41625 8.08403 11.375 10.5 11.375ZM10.5 11.375C14.37 11.375 17.5 14.51 17.5 18.375M10.5 11.375C6.63 11.375 3.5 14.51 3.5 18.375" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Profil</span>
        </a>
      </div>
    </nav>
  </main>

  <script src="js/app.js?v=20261125v3"></script>
  <script>
    (async () => {
      const user = SarprasApp.requirePenghuniAuth();
      if (!user) return;

      if (user.nomor_kamar) {
        const gedungTxt = user.gedung ? `${user.gedung} \u2022 ` : '';
        document.getElementById('fasilitasRoomSub').textContent =
          `${gedungTxt}Kamar ${user.nomor_kamar} \u2022 Lantai ${user.lantai || '-'}`;
      }

      const fasilitasList = document.getElementById('fasilitasList');
      const fasilitasCountLabel = document.getElementById('fasilitasCountLabel');

      function renderCard(item) {
        const meta = SarprasApp.getKondisiMeta(item.kondisi);
        const locationPill = item.is_umum
          ? '<span class="terdampak-pill" style="margin-bottom:4px;">Fasilitas Umum</span>'
          : `<span class="priority-pill" style="margin-bottom:4px;">${item.gedung ? SarprasApp.escapeHtml(item.gedung) + ' \u2022 ' : ''}Kamar ${SarprasApp.escapeHtml(item.nomor_kamar)} \u2022 Lt. ${SarprasApp.escapeHtml(item.lantai || '-')}</span>`;
        return `
          <article class="facility-card">
            <div class="facility-header">
              <div style="min-width:0;">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;">
                  ${locationPill}
                </div>
                <div class="report-code">${SarprasApp.escapeHtml(item.kode_aset)} &bull; ${SarprasApp.escapeHtml(item.nama_kategori)}</div>
                <h3 class="facility-title" style="margin-top:4px;">${SarprasApp.escapeHtml(item.nama_fasilitas)}</h3>
                <div class="facility-brand">${SarprasApp.escapeHtml(item.merk_tipe || 'Merk belum dicatat')}</div>
              </div>
              <span class="status-badge ${meta.className}">
                <span class="status-dot"></span>
                <span>${SarprasApp.escapeHtml(meta.label)}</span>
              </span>
            </div>
            <div class="kv-row">
              <span class="kv-label">Tanggal Pasang</span>
              <span class="kv-value">${SarprasApp.escapeHtml(SarprasApp.formatDateIndo(item.tgl_pasang))}</span>
            </div>
            <a href="buat-laporan.html?fasilitasId=${encodeURIComponent(item.id_fasilitas)}" class="btn btn-secondary btn-sm">
              Laporkan Kerusakan Aset Ini
            </a>
          </article>
        `;
      }

      try {
        const list = await SarprasApp.fetchFasilitasByPenghuni(user.id_pengguna);
        const items = Array.isArray(list) ? list : [];
        fasilitasCountLabel.textContent = `${items.length} item`;

        if (items.length === 0) {
          fasilitasList.innerHTML = '<div class="empty-state">Belum ada fasilitas tercatat.</div>';
        } else {
          fasilitasList.innerHTML = items.map(renderCard).join('');
        }
      } catch (err) {
        fasilitasList.innerHTML = `<div class="error-banner visible">${SarprasApp.escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
