<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setujui &amp; Tugaskan — SarprasKost</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="mobile-shell">
    <header class="app-bar">
      <a id="backToDetailBtn" href="owner-laporan.html" class="back-btn" aria-label="Kembali ke detail laporan">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4.166L4.16602 10L10 15.834M4.16602 10H15.834" stroke="#172554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <div class="app-bar-titles">
        <h1 class="app-bar-title">Setujui &amp; tugaskan</h1>
        <p id="pageKodeSub" class="app-bar-subtitle">Penugasan teknisi perbaikan</p>
      </div>
    </header>

    <section class="page-body">
      <div id="summaryCard" class="summary-mini-card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <span id="summaryKode" class="report-code">Memuat...</span>
          <span id="summaryPenghuni" style="font-size:11px;color:#64748B;">-</span>
        </div>
        <div id="summaryTitle" style="font-size:14px;font-weight:600;color:#172554;">Memuat detail laporan...</div>
        <div id="summaryLokasi" style="font-size:12px;color:#64748B;">-</div>
      </div>

      <form id="setujuiForm" class="form-stack" novalidate>
        <div id="formError" class="error-banner" role="alert"></div>

        <div class="form-group">
          <label class="form-label" for="mekanikSelect">Pilih teknisi / mekanik</label>
          <div class="input-wrap">
            <select id="mekanikSelect" name="mekanik_id" class="input-control" required>
              <option value="">Memuat daftar teknisi...</option>
            </select>
          </div>
          <span class="form-hint">Teknisi akan menerima penugasan perbaikan untuk laporan ini.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="prioritasSelect">Prioritas</label>
          <div class="input-wrap">
            <select id="prioritasSelect" name="prioritas" class="input-control" required>
              <option value="Rendah">Rendah</option>
              <option value="Sedang" selected>Sedang</option>
              <option value="Tinggi">Tinggi</option>
              <option value="Darurat">Darurat</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="catatanOwnerInput">Catatan untuk mekanik (opsional)</label>
          <div class="input-wrap textarea-wrap">
            <textarea
              id="catatanOwnerInput"
              name="catatan_owner"
              class="textarea-control"
              placeholder="Contoh: Bawa seal cadangan, koordinasi dengan penghuni sebelum masuk kamar..."
            ></textarea>
          </div>
        </div>

        <div class="info-banner">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none" style="flex-shrink:0;margin-top:2px;">
            <path d="M8.50004 11.3336V8.50001M8.50004 5.66645H8.50712M15.5839 8.50001C15.5839 12.4123 12.4124 15.5839 8.50004 15.5839C4.58771 15.5839 1.41614 12.4123 1.41614 8.50001C1.41614 4.58768 4.58771 1.41611 8.50004 1.41611C12.4124 1.41611 15.5839 4.58768 15.5839 8.50001Z" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <span>Status laporan akan otomatis berubah menjadi <strong>Diproses</strong> dan tercatat di progres penghuni.</span>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Setujui &amp; Tugaskan</button>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script>
    (async () => {
      const user = SarprasApp.requireOwnerAuth();
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const backToDetailBtn = document.getElementById('backToDetailBtn');
      const mekanikSelect = document.getElementById('mekanikSelect');
      const prioritasSelect = document.getElementById('prioritasSelect');
      const catatanOwnerInput = document.getElementById('catatanOwnerInput');
      const setujuiForm = document.getElementById('setujuiForm');
      const formError = document.getElementById('formError');
      const submitBtn = document.getElementById('submitBtn');

      function showError(msg) {
        formError.textContent = msg;
        formError.classList.add('visible');
      }

      function hideError() {
        formError.textContent = '';
        formError.classList.remove('visible');
      }

      if (!id) {
        showError('ID laporan tidak ditemukan di URL.');
        submitBtn.disabled = true;
        return;
      }

      backToDetailBtn.href = `owner-detail-laporan.html?id=${encodeURIComponent(id)}`;

      try {
        const [laporan, mekanikList] = await Promise.all([
          SarprasApp.requestJson(`/laporan/${encodeURIComponent(id)}`),
          SarprasApp.fetchMekanikList()
        ]);

        document.getElementById('pageKodeSub').textContent = laporan.kode_laporan;
        document.getElementById('summaryKode').textContent = laporan.kode_laporan;
        document.getElementById('summaryPenghuni').textContent = laporan.nama_penghuni
          ? `${laporan.nama_penghuni}${laporan.nomor_kamar_penghuni ? ' • Kamar ' + laporan.nomor_kamar_penghuni : ''}`
          : '-';
        document.getElementById('summaryTitle').textContent = SarprasApp.deriveTitle(laporan);
        document.getElementById('summaryLokasi').textContent = `${laporan.kategori_fasilitas} • ${laporan.lokasi_kamar}`;

        if (!mekanikList || mekanikList.length === 0) {
          mekanikSelect.innerHTML = '<option value="">Belum ada teknisi terdaftar</option>';
          submitBtn.disabled = true;
        } else {
          mekanikSelect.innerHTML = '<option value="">-- Pilih teknisi --</option>' +
            mekanikList.map((m) => {
              const skill = m.nomor_kamar ? ` (${m.nomor_kamar})` : '';
              return `<option value="${SarprasApp.escapeHtml(m.id)}">${SarprasApp.escapeHtml(m.nama + skill)}</option>`;
            }).join('');

          if (laporan.mekanik_id) {
            mekanikSelect.value = String(laporan.mekanik_id);
          }
        }

        if (laporan.prioritas) {
          prioritasSelect.value = laporan.prioritas;
        }
        if (laporan.catatan_owner) {
          catatanOwnerInput.value = laporan.catatan_owner;
        }
      } catch (err) {
        showError(err.message || 'Gagal memuat data penugasan.');
      }

      setujuiForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const mekanikIdRaw = mekanikSelect.value;
        const prioritas = prioritasSelect.value;
        const catatanOwner = catatanOwnerInput.value.trim();

        if (!mekanikIdRaw) {
          showError('Silakan pilih teknisi yang akan ditugaskan.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Menyimpan penugasan...';

        try {
          await SarprasApp.requestJson(`/owner/laporan/${encodeURIComponent(id)}/setujui`, {
            method: 'PUT',
            body: JSON.stringify({
              mekanik_id: Number(mekanikIdRaw),
              prioritas,
              catatan_owner: catatanOwner
            })
          });

          window.location.href = `owner-konfirmasi.html?status=disetujui&id=${encodeURIComponent(id)}`;
        } catch (err) {
          showError(err.message || 'Gagal menyetujui dan menugaskan laporan.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Setujui & Tugaskan';
        }
      });
    })();
  </script>
</body>
</html>
