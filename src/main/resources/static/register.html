<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun — SarprasKost</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="mobile-shell">
    <header class="app-bar">
      <a href="login.html" class="back-btn" aria-label="Kembali ke halaman masuk">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4.166L4.16602 10L10 15.834M4.16602 10H15.834" stroke="#172554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <div class="app-bar-titles">
        <h1 class="app-bar-title">Daftar Akun</h1>
        <p class="app-bar-subtitle">Registrasi penghuni Kost Cendana</p>
      </div>
    </header>

    <section class="page-body">
      <div class="login-intro" style="margin-top:4px;">
        <h2 class="login-heading" style="font-size:26px;">Buat akun baru.</h2>
        <p class="login-sub">Daftarkan diri Anda untuk melaporkan kerusakan dan memantau fasilitas kamar kost.</p>
      </div>

      <form id="registerForm" class="form-stack" novalidate>
        <div id="registerError" class="error-banner" role="alert"></div>

        <div class="form-group">
          <label class="form-label" for="namaInput">Nama lengkap</label>
          <div class="input-wrap">
            <input
              id="namaInput"
              name="nama_lengkap"
              type="text"
              class="input-control"
              placeholder="Contoh: Akbar"
              autocomplete="name"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="emailInput">Email</label>
          <div class="input-wrap">
            <input
              id="emailInput"
              name="email"
              type="email"
              class="input-control"
              placeholder="nama@email.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="noHpInput">Nomor HP / WhatsApp</label>
          <div class="input-wrap">
            <input
              id="noHpInput"
              name="no_hp"
              type="tel"
              class="input-control"
              placeholder="Contoh: 081234567890"
              required
            />
          </div>
          <span class="form-hint">Wajib diisi &amp; unik untuk kontak penanganan darurat.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="kamarSelect">Pilih kamar</label>
          <div class="input-wrap">
            <select id="kamarSelect" name="id_kamar" class="input-control">
              <option value="">Memuat daftar kamar...</option>
            </select>
          </div>
          <span class="form-hint">Opsional, dapat diatur atau diubah nanti di halaman profil.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Kata sandi</label>
          <div class="input-wrap">
            <input
              id="passwordInput"
              name="password"
              type="password"
              class="input-control"
              placeholder="Buat kata sandi"
              autocomplete="new-password"
              required
            />
            <button type="button" id="togglePasswordBtn" class="input-icon-btn" aria-label="Tampilkan kata sandi">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M1.5 9C2.7 5.7 5.6 3.75 9 3.75C12.4 3.75 15.3 5.7 16.5 9C15.3 12.3 12.4 14.25 9 14.25C5.6 14.25 2.7 12.3 1.5 9Z" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />
                <circle cx="9" cy="9" r="2.25" stroke="#64748B" stroke-width="1.4" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPasswordInput">Konfirmasi kata sandi</label>
          <div class="input-wrap">
            <input
              id="confirmPasswordInput"
              name="confirm_password"
              type="password"
              class="input-control"
              placeholder="Ulangi kata sandi"
              autocomplete="new-password"
              required
            />
          </div>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary">Daftar Sekarang</button>
      </form>

      <div class="auth-footer-link" style="padding-top:4px;">
        Sudah punya akun? <a href="login.html" class="text-link">Masuk di sini</a>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script>
    (async () => {
      const registerForm = document.getElementById('registerForm');
      const namaInput = document.getElementById('namaInput');
      const emailInput = document.getElementById('emailInput');
      const noHpInput = document.getElementById('noHpInput');
      const kamarSelect = document.getElementById('kamarSelect');
      const passwordInput = document.getElementById('passwordInput');
      const confirmPasswordInput = document.getElementById('confirmPasswordInput');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const registerError = document.getElementById('registerError');
      const registerBtn = document.getElementById('registerBtn');

      function showError(msg) {
        registerError.textContent = msg;
        registerError.classList.add('visible');
        registerError.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function hideError() {
        registerError.textContent = '';
        registerError.classList.remove('visible');
      }

      try {
        const rooms = await SarprasApp.fetchKamar();
        const privateRooms = (rooms || []).filter((r) => !r.is_umum && (r.nomor_kamar || '').toUpperCase() !== 'UMUM');
        kamarSelect.innerHTML = '<option value="">-- Pilih kamar (opsional) --</option>' +
          privateRooms.map((r) => `<option value="${SarprasApp.escapeHtml(r.id_kamar)}">Kamar ${SarprasApp.escapeHtml(r.nomor_kamar)} (${SarprasApp.escapeHtml(r.tipe_kamar)} &bull; Lantai ${SarprasApp.escapeHtml(r.lantai)})</option>`).join('');
      } catch {
        kamarSelect.innerHTML = '<option value="">-- Kamar belum tersedia --</option>';
      }

      togglePasswordBtn.addEventListener('click', () => {
        const nextType = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = nextType;
        confirmPasswordInput.type = nextType;
      });

      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const nama_lengkap = namaInput.value.trim();
        const email = emailInput.value.trim();
        const no_hp = noHpInput.value.trim();
        const idKamarRaw = kamarSelect.value;
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!nama_lengkap || !email || !no_hp || !password) {
          showError('Nama lengkap, email, nomor HP, dan kata sandi wajib diisi.');
          return;
        }
        if (password !== confirmPassword) {
          showError('Konfirmasi kata sandi tidak cocok.');
          return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = 'Mendaftarkan...';

        try {
          const payload = { nama_lengkap, email, no_hp, password };
          if (idKamarRaw) {
            payload.id_kamar = Number(idKamarRaw);
          }
          const user = await SarprasApp.requestJson('/users/register', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          SarprasApp.saveUser(user);
          window.location.href = user.redirect_url || 'home.html';
        } catch (err) {
          showError(err.message || 'Gagal membuat akun baru.');
          registerBtn.disabled = false;
          registerBtn.textContent = 'Daftar Sekarang';
        }
      });
    })();
  </script>
</body>
</html>
