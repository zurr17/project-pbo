<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Tugas Teknisi — SarprasKost</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="mobile-shell">
    <header class="app-bar">
      <a href="mekanik-home.html" class="back-btn" aria-label="Kembali ke beranda mekanik">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4.166L4.16602 10L10 15.834M4.16602 10H15.834" stroke="#172554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <div class="app-bar-titles">
        <h1 class="app-bar-title">Tugas saya</h1>
        <p class="app-bar-subtitle">Daftar pekerjaan perbaikan yang ditugaskan</p>
      </div>
    </header>

    <section class="page-body has-bottom-nav">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M15.7501 15.7501L12.4951 12.4951M14.25 8.25C14.25 11.5637 11.5637 14.25 8.25 14.25C4.93629 14.25 2.25 11.5637 2.25 8.25C2.25 4.93629 4.93629 2.25 8.25 2.25C11.5637 2.25 14.25 4.93629 14.25 8.25Z" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <input
          id="searchInput"
          type="search"
          class="search-input"
          placeholder="Cari kode tugas, kamar, atau keluhan"
          aria-label="Cari kode tugas, kamar, atau keluhan"
        />
      </div>

      <div class="filter-tabs three-cols" role="tablist" aria-label="Filter status tugas">
        <button type="button" class="filter-tab active" data-status="SEMUA">Semua</button>
        <button type="button" class="filter-tab" data-status="DIPROSES">Diproses</button>
        <button type="button" class="filter-tab" data-status="SELESAI">Selesai</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="section-header">
          <span id="countLabel" style="font-size:13px;font-weight:600;color:#172554;">0 tugas</span>
          <span style="font-size:11px;color:#64748B;">Terbaru lebih dulu</span>
        </div>

        <div id="mekanikTugasList" class="report-list">
          <div class="loading-state">Memuat daftar tugas...</div>
        </div>
      </div>

      <div class="info-banner muted">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" style="flex-shrink:0;margin-top:2px;">
          <path d="M8.50004 11.3336V8.50001M8.50004 5.66645H8.50712M15.5839 8.50001C15.5839 12.4123 12.4124 15.5839 8.50004 15.5839C4.58771 15.5839 1.41614 12.4123 1.41614 8.50001C1.41614 4.58768 4.58771 1.41611 8.50004 1.41611C12.4124 1.41611 15.5839 4.58768 15.5839 8.50001Z" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" />
        </svg>
        <span>Ketuk kartu tugas untuk melihat detail kerusakan, instruksi owner, lalu perbarui status pengerjaan.</span>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Navigasi mekanik">
      <div class="bottom-nav-grid">
        <a href="mekanik-home.html" class="bottom-nav-item">
          <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
            <path d="M13.125 18.3743V11.3743C13.125 10.9 12.73 10.4993 12.25 10.4993H8.75C8.27 10.4993 7.875 10.9 7.875 11.3743V18.3743M2.625 8.74975C2.625 8.23 2.86 7.74 3.245 7.41L9.37 2.16C10.02 1.61 10.98 1.61 11.63 2.16L17.755 7.41C18.14 7.74 18.375 8.23 18.375 8.75V16.625C18.375 17.59 17.59 18.375 16.625 18.375H4.375C3.41 18.375 2.625 17.59 2.625 16.625V8.74975Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span>Beranda</span>
        </a>
        <a href="mekanik-tugas.html" class="bottom-nav-item active">
          <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
            <path d="M13.9997 3.49947H15.7495C16.716 3.49947 17.4993 4.283 17.4993 5.24961V17.5006C17.4993 18.467 16.716 19.2507 15.7495 19.2507H5.25056C4.284 19.2507 3.50073 18.467 3.50073 17.5006V5.24961C3.50073 4.283 4.284 3.49947 5.25056 3.49947H7.00038M10.5 9.62496H13.9997M10.5 14.0003H13.9997M7.00038 9.62496H7.00913M7.00038 14.0003H7.00913M7.87529 1.74933H13.1248C13.608 1.74933 13.9997 2.14111 13.9997 2.6244V4.37454C13.9997 4.85783 13.608 5.24961 13.1248 5.24961H7.87529C7.39209 5.24961 7.00038 4.85783 7.00038 4.37454V2.6244C7.00038 2.14111 7.39209 1.74933 7.87529 1.74933Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span>Tugas</span>
        </a>
        <button type="button" id="navNotifBtn" class="bottom-nav-item">
          <svg width="21" height="21" viewBox="0 0 19 19" fill="none">
            <path d="M8.12785 16.6256C8.26682 16.8663 8.4667 17.0662 8.70739 17.2052C8.94809 17.3441 9.22112 17.4173 9.49904 17.4173C9.77697 17.4173 10.05 17.3441 10.2907 17.2052C10.5314 17.0662 10.7313 16.8663 10.8702 16.6256M2.58184 12.1333C2.47842 12.2467 2.41017 12.3877 2.38539 12.5391C2.36061 12.6906 2.38037 12.8459 2.44227 12.9864C2.50417 13.1268 2.60554 13.2462 2.73405 13.33C2.86255 13.4139 3.01266 13.4586 3.1661 13.4587H15.833C15.9865 13.4588 16.1366 13.4142 16.2652 13.3305C16.3938 13.2468 16.4953 13.1276 16.5573 12.9872C16.6194 12.8469 16.6394 12.6916 16.6148 12.5401C16.5902 12.3887 16.5221 12.2476 16.4189 12.1341C15.3659 11.0487 14.2497 9.89511 14.2497 6.3331C14.2497 5.07322 13.7492 3.86494 12.8584 2.97406C11.9676 2.08319 10.7594 1.5827 9.49957 1.5827C8.23976 1.5827 7.03156 2.08319 6.14074 2.97406C5.24993 3.86494 4.74947 5.07322 4.74947 6.3331C4.74947 9.89511 3.63241 11.0487 2.58184 12.1333Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span>Notifikasi</span>
        </button>
        <button type="button" id="navAkunBtn" class="bottom-nav-item">
          <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
            <path d="M10.5 11.375C12.916 11.375 14.8746 9.41625 14.8746 7C14.8746 4.58375 12.916 2.625 10.5 2.625C8.08403 2.625 6.12547 4.58375 6.12547 7C6.12547 9.41625 8.08403 11.375 10.5 11.375ZM10.5 11.375C14.37 11.375 17.5 14.51 17.5 18.375M10.5 11.375C6.63 11.375 3.5 14.51 3.5 18.375" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span>Akun</span>
        </button>
      </div>
    </nav>

    <div id="notifSheet" class="sheet-backdrop" role="dialog" aria-modal="true">
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="section-header">
          <h3 class="section-title">Tugas Terbaru</h3>
          <button type="button" class="text-link" data-close-sheet="notifSheet">Tutup</button>
        </div>
        <div id="notifList" class="report-list"></div>
      </div>
    </div>

    <div id="akunSheet" class="sheet-backdrop" role="dialog" aria-modal="true">
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="section-header">
          <h3 class="section-title">Akun Teknisi</h3>
          <button type="button" class="text-link" data-close-sheet="akunSheet">Tutup</button>
        </div>
        <div class="summary-mini-card">
          <div class="kv-row">
            <span class="kv-label">Nama</span>
            <span id="akunNama" class="kv-value">-</span>
          </div>
          <div class="kv-row">
            <span class="kv-label">Email</span>
            <span id="akunEmail" class="kv-value">-</span>
          </div>
          <div class="kv-row">
            <span class="kv-label">Bidang</span>
            <span id="akunSpesialisasi" class="kv-value">-</span>
          </div>
          <div class="kv-row">
            <span class="kv-label">Peran</span>
            <span id="akunRole" class="kv-value">MEKANIK</span>
          </div>
        </div>
        <button type="button" id="logoutBtn" class="btn btn-danger-outline">Keluar dari Akun</button>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    (() => {
      const user = SarprasApp.requireMekanikAuth();
      if (!user) return;

      const listEl = document.getElementById('mekanikTugasList');
      const countLabel = document.getElementById('countLabel');
      const searchInput = document.getElementById('searchInput');
      const tabButtons = document.querySelectorAll('.filter-tab');

      const params = new URLSearchParams(window.location.search);
      const urlStatus = (params.get('status') || 'SEMUA').toUpperCase();
      let activeStatus = ['SEMUA', 'DIPROSES', 'SELESAI'].includes(urlStatus) ? urlStatus : 'SEMUA';
      let searchTimer = null;

      SarprasApp.populateMekanikAccountSheet(user);
      SarprasApp.attachSheetControls();
      document.getElementById('navNotifBtn').addEventListener('click', () => SarprasApp.openSheet('notifSheet'));
      document.getElementById('navAkunBtn').addEventListener('click', () => SarprasApp.openSheet('akunSheet'));

      function syncTabs() {
        tabButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.status === activeStatus);
        });
      }

      async function loadTugas() {
        listEl.innerHTML = '<div class="loading-state">Memuat daftar tugas...</div>';
        try {
          const data = await SarprasApp.fetchMekanikTugas(user.id, activeStatus, searchInput.value);
          const { laporan } = data;
          countLabel.textContent = `${laporan.length} tugas`;

          if (!searchInput.value.trim() && activeStatus === 'SEMUA') {
            SarprasApp.populateMekanikNotifSheet(laporan);
          }

          if (!laporan || laporan.length === 0) {
            listEl.innerHTML = '<div class="empty-state">Tidak ada tugas yang cocok dengan filter atau kata kunci ini.</div>';
          } else {
            listEl.innerHTML = laporan.map(SarprasApp.renderMekanikTaskCard).join('');
          }
        } catch (err) {
          countLabel.textContent = '0 tugas';
          listEl.innerHTML = `<div class="error-banner visible">${SarprasApp.escapeHtml(err.message)}</div>`;
        }
      }

      tabButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          activeStatus = btn.dataset.status;
          syncTabs();
          loadTugas();
        });
      });

      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadTugas, 260);
      });

      syncTabs();
      loadTugas();
    })();
  </script>
</body>
</html>
